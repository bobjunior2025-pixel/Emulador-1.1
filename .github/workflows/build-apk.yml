name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build (debug ou release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restaurar Chave de Assinatura de Depuração (Debug Keystore)
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decodificando debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Gerando novo debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar APK de Depuração (assembleDebug)
        if: "${{ github.event.inputs.build_type != 'release' }}"
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Compilar APK de Produção (assembleRelease)
        if: "${{ github.event.inputs.build_type == 'release' }}"
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Localizar APK gerado
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK encontrado em: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Fazer Upload do APK como Artefato do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: RetroPlay-APK-${{ github.event.inputs.build_type || 'debug' }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Resumo do Build
        run: |
          echo "### 🎮 Build do APK Concluído com Sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: RetroPlay 64 & PSX" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Arquivo gerado**: \`${{ steps.find_apk.outputs.apk_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para baixar o APK, acesse a aba **Actions** neste repositório e baixe o artefato gerado na seção **Artifacts**." >> $GITHUB_STEP_SUMMARY
