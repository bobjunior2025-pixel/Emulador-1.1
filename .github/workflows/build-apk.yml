name: Criar APK (Android)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build (debug ou release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Preparar ambiente e variáveis (.env)
        run: |
          if [ ! -f .env ]; then
            echo "Criando arquivo .env a partir de .env.example..."
            cp .env.example .env || touch .env
          fi

      - name: Restaurar Chave de Assinatura de Depuração (debug.keystore)
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decodificando debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Gerando novo debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar APK (${{ github.event.inputs.build_type || 'debug' }})
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew :app:assembleRelease --stacktrace --no-configuration-cache
          else
            ./gradlew :app:assembleDebug --stacktrace --no-configuration-cache
          fi

      - name: Localizar APK gerado
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Erro: Nenhum APK encontrado!"
            exit 1
          fi
          echo "APK gerado em: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Fazer Upload do APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: RetroPlay-APK-${{ github.event.inputs.build_type || 'debug' }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Publicar Resumo do Build
        if: always()
        run: |
          echo "### 🎮 Build do APK Concluído!" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: RetroPlay 64 & PSX" >> $GITHUB_STEP_SUMMARY
          echo "- **Tipo**: \`${{ github.event.inputs.build_type || 'debug' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ Sucesso' || '❌ Falhou' }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- **Arquivo APK**: \`${{ steps.find_apk.outputs.apk_path }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📥 Baixe o APK na seção **Artifacts** no final desta página da execução do GitHub Actions." >> $GITHUB_STEP_SUMMARY
          fi
